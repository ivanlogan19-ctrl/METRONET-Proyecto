spring.application.name=backend

spring.datasource.url=${METRONET_DB_URL:jdbc:postgresql://localhost:5432/metronet_proyecto}
spring.datasource.username=${METRONET_DB_USUARIO:logan}
spring.datasource.password=${METRONET_DB_CONTRASENA:}

spring.jpa.hibernate.ddl-auto=${METRONET_DDL_AUTO:update}
spring.jpa.show-sql=${METRONET_MOSTRAR_SQL:false}
spring.jpa.properties.hibernate.format_sql=${METRONET_FORMATO_SQL:false}

spring.jpa.open-in-view=false

metronet.correo.habilitado=${METRONET_SMTP_HABILITADO:false}
metronet.correo.remitente=${METRONET_SMTP_REMITENTE:}
spring.mail.host=${METRONET_SMTP_HOST:}
spring.mail.port=${METRONET_SMTP_PUERTO:587}
spring.mail.username=${METRONET_SMTP_USUARIO:}
spring.mail.password=${METRONET_SMTP_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=${METRONET_SMTP_AUTENTICACION:true}
spring.mail.properties.mail.smtp.starttls.enable=${METRONET_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${METRONET_SMTP_TIEMPO_ESPERA_CONEXION:5000}
spring.mail.properties.mail.smtp.timeout=${METRONET_SMTP_TIEMPO_ESPERA_LECTURA:5000}
spring.mail.properties.mail.smtp.writetimeout=${METRONET_SMTP_TIEMPO_ESPERA_ESCRITURA:5000}
