<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · METRONET</title>
    <link rel="stylesheet" href="/src/autenticacion/autenticacion.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="tituloLogin">
        <div
          class="mobile-brand auth-marca"
          data-metronet-logo
          data-logo-alternativo=""
        ></div>
        <p class="eyebrow">Acceso a METRONET</p>
        <h1 id="tituloLogin">Iniciar sesión</h1>
        <p class="auth-subtitle">
          Ingresá tus datos para continuar en la plataforma.
        </p>
        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="Ingresá tu correo electrónico"
                required
              />
            </div>
          </div>
          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Ingresá tu contraseña"
                required
              />
              <button
                class="toggle-password"
                type="button"
                data-target="password"
              >
                Mostrar
              </button>
            </div>
          </div>
          <button id="loginButton" class="primary-button" type="submit">
            <span class="button-text">Iniciar sesión</span>
            <span class="button-loader" aria-hidden="true"></span>
          </button>
        </form>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <p class="auth-link">
          <a href="/recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="auth-link">
          ¿No tenés una cuenta? <a href="/registro.html">Crear cuenta</a>
        </p>
        <div class="auth-acceso-secundario">
          <p class="auth-link">
            ¿Sos administrador?
            <a href="/admin-login.html">Acceso administrativo</a>
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/componentes/inicializarLogoMetronet.js"></script>
    <script type="module" src="/src/autenticacion/login.js"></script>
  </body>
</html>
