<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña · METRONET</title>
    <link rel="stylesheet" href="/src/autenticacion/autenticacion.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="tituloRecuperacion">
        <div class="mobile-brand auth-marca" data-metronet-logo></div>
        <p class="eyebrow">Recuperación de acceso</p>
        <h1 id="tituloRecuperacion">Recuperar acceso</h1>
        <p class="auth-subtitle">
          Ingresá el correo electrónico asociado a tu cuenta para recibir un
          código de recuperación.
        </p>
        <form id="formularioRecuperacion" class="auth-form" novalidate>
          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="Ingresá tu correo electrónico"
                required
              />
            </div>
          </div>
          <p class="auth-ayuda">
            Si existe una cuenta asociada, enviaremos un código temporal a ese correo.
          </p>
          <button id="botonRecuperar" class="primary-button" type="submit">
            <span class="button-text">Enviar código</span>
            <span class="button-loader" aria-hidden="true"></span>
          </button>
        </form>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <p class="auth-link"><a href="/login.html">← Volver a iniciar sesión</a></p>
      </section>
    </main>
    <script type="module" src="/src/componentes/inicializarLogoMetronet.js"></script>
    <script type="module" src="/src/autenticacion/recuperar-contrasena.js"></script>
  </body>
</html>
