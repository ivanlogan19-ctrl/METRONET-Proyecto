<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METRONET</title>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #000000;

            font-family:
                "Courier New",
                Courier,
                monospace;

        }


        body {

            background: #000000;

            color: #FFFFFF;

            font-family:
                "Courier New",
                Courier,
                monospace;

        }


        button,
        input,
        select,
        textarea {

            font-family:
                "Courier New",
                Courier,
                monospace;

        }


        button {

            color: #FFFFFF;

            background: #000000;

            border:
                1px solid
                #0B5EA8;

            border-radius: 0;

        }


        button:hover {

            background:
                #071A2B;

            border-color:
                #2B9BE8;

        }


        input,
        select,
        textarea {

            color: #FFFFFF;

            background:
                #000000;

            border:
                1px solid
                #0B5EA8;

            border-radius: 0;

        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color:
                #2B9BE8;

        }


        canvas {

            display: block;

            background:
                #000000;

        }

    </style>

</head>


<body>

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
