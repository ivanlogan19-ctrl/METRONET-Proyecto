<!DOCTYPE html>
<html lang="es" data-contexto-musical="general">

<head>
  <link rel="stylesheet" href="/src/estilos/navegacion-estable.css" />
  <script src="/transicion-pagina.js"></script>
  <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" async vite-ignore src="/src/audio/ReanudacionTemprana.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METRONET</title>


    <link rel="stylesheet" href="/src/mapa/estilos/layout-editor.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />

    <link rel="stylesheet" href="/src/estilos/retro.css" />
    <link rel="stylesheet" href="/src/mapa/estilos/editor-red.css" />
    <link rel="stylesheet" href="/src/mapa/estilos/referencias-poi.css" />

  <script
        type="module" blocking="render"
        src="./src/main.js"
    ></script>
</head>


<body class="metronet-pagina-editor">

    <div class="metronet-pantalla-editor">
        <div data-navegacion-global></div>
        <section class="metronet-estado-editor" data-estado-editor aria-label="Asistencia y mensajes del editor"></section>
        <div id="metronet-aplicacion">

        <section class="metronet-consigna-externa metronet-consigna" data-contenedor-consigna aria-label="Objetivos del nivel"></section>
        <div class="metronet-area-mapa">
            <h2 class="metronet-mapa-titulo" data-titulo-mapa hidden></h2>
            <section class="metronet-barra-geografica" aria-label="Opciones del mapa">
                <div data-contenedor-referencias></div>
                <div data-hud-mapa></div>
            </section>
            <main id="metronet-mapa" aria-label="Mapa de Montevideo"><p class="metronet-mapa-cargando" role="status">Preparando mapa…</p><div class="metronet-mandos-mapa" aria-label="Controles del mapa"></div></main>
        </div>

        <aside
            id="metronet-panel-controles"
            aria-label="Herramientas"
        >
            <header class="metronet-panel-editor-cabecera">
                <div>
                    <h1 class="metronet-panel-titulo" data-titulo-editor>Herramientas</h1>
                </div>
                <button class="metronet-panel-editor-toggle" data-panel-edicion-toggle type="button" aria-expanded="true">Herramientas</button>
            </header>
            <div class="metronet-panel-editor-contenido" data-panel-edicion-contenido>
                <section class="metronet-panel-editor-herramientas" data-contenedor-editor-red></section>
            </div>
            <footer class="metronet-panel-editor-pie" data-panel-editor-pie></footer>
        </aside>

    </div>
    </div>



</body>

</html>
