<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METRONET</title>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #D9ECFF;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

        }


        body {

            background: #D9ECFF;

            color: #1A2340;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

        }


        #metronet-aplicacion {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                clamp(230px, 23vw, 300px);

            width: 100%;

            height: 100%;

            padding: 16px;

            background: #D9ECFF;

            box-sizing: border-box;

        }


        #metronet-mapa {

            position: relative;

            min-width: 0;

            min-height: 0;

            overflow: hidden;

            border-radius: 18px;

            background: #D9ECFF;

            box-shadow: 0 10px 28px rgba(59, 120, 200, 0.14);

        }


        #metronet-panel-controles {

            display: flex;

            flex-direction: column;

            gap: 12px;

            min-width: 0;

            padding: 18px 14px;

            overflow-y: auto;

            border-radius: 18px;

            background: #F8FBFF;

            box-shadow: 0 10px 28px rgba(59, 120, 200, 0.14);

            box-sizing: border-box;

        }


        .metronet-logo-marca {

            display: grid;

            place-items: center;

            align-self: center;

            aspect-ratio: 1;

            padding: 7px;

            background: #1A2340;

            overflow: hidden;

        }


        .metronet-logo-marca img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            mix-blend-mode: screen;

        }


        .metronet-panel-titulo {

            margin: 0 4px 2px;

            color: #1A2340;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-transform: uppercase;

        }


        .metronet-control-sesion {

            width: 100%;

            margin: 4px 0 0;

            padding: 9px 10px;

            color: #1A2340;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.03em;

            cursor: pointer;

        }


        .metronet-informacion-jugador {

            display: grid;

            gap: 6px;

            width: 100%;

        }


        .metronet-informacion-jugador-titulo {

            margin: 6px 4px -2px;

            color: #1A2340;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.08em;

            text-transform: uppercase;

        }


        .metronet-control-perfil {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding: 0 13px;

            border-radius: 13px;

            color: #1A2340;

            background:
                linear-gradient(
                    135deg,
                    #3B78C8,
                    #3B78C8
                );

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 0.01em;

            text-align: center;

            text-decoration: none;

        }

        .metronet-control-simulacion {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding: 0 13px;

            border: none;

            border-radius: 13px;

            color: #1A2340;

            background: #D9ECFF;

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            font-size: 13px;

            font-weight: 600;

            text-align: center;

            text-decoration: none;

        }


        .metronet-control-simulacion:hover,
        .metronet-control-simulacion:focus-visible {

            background: #9BC8FF;

        }


        .metronet-control-perfil:hover,
        .metronet-control-perfil:focus-visible {

            background:
                linear-gradient(
                    135deg,
                    #3B78C8,
                    #9BC8FF
                );

        }


        .metronet-control-perfil-indicador {

            margin-left: 4px;

            font-size: 13px;

        }


        .metronet-control-sesion:hover,
        .metronet-control-sesion:focus-visible {

            color: #F8FBFF;

            background: #1A2340;

            border-color: #F8FBFF;

        }


        .metronet-estado-puntos {

            margin: 0;

            padding: 10px;

            border-left: 3px solid #F3C86B;

            color: #FFF0C5;

            background: rgba(243, 200, 107, 0.12);

            font-size: 12px;

            line-height: 1.45;

        }


        @media (max-width: 900px) {

            #metronet-aplicacion {

                grid-template-columns: minmax(0, 1fr);

                grid-template-rows: auto minmax(0, 1fr);

            }


            #metronet-panel-controles {

                display: grid;

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 8px;

                max-height: 43vh;

                padding: 10px;

                overflow-y: auto;

                border-right: none;

                border-bottom:
                    1px solid rgba(155, 200, 255, 0.22);

                box-shadow:
                    0 8px 18px rgba(0, 0, 0, 0.16);

            }


            .metronet-panel-titulo {

                grid-column: 1 / -1;

                margin: 0 2px;

            }


            .metronet-control-sesion {

                grid-column: 1 / -1;

                margin: 2px 0 0;

            }


            .metronet-informacion-jugador {

                grid-column: 1 / -1;

            }


            .metronet-estado-puntos {

                grid-column: 1 / -1;

            }

        }


        button,
        input,
        select,
        textarea {

            font-family:
                Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

        }


        button {

            color: #F8FBFF;

            background: #1A2340;

            border:
                1px solid
                #3B78C8;

            border-radius: 0;

        }


        button:hover {

            background:
                #071A2B;

            border-color:
                #9BC8FF;

        }


        input,
        select,
        textarea {

            color: #F8FBFF;

            background:
                #1A2340;

            border:
                1px solid
                #3B78C8;

            border-radius: 0;

        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color:
                #9BC8FF;

        }


        canvas {

            display: block;

            background:
                #1A2340;

        }


        /* Tema sobrio compartido: una base oscura y un único acento azul. */
        html,
        body {
            background: #070A0F;
            color: #F4F7FA;
        }

        #metronet-aplicacion {
            gap: 12px;
            padding: 12px;
            background: #070A0F;
        }

        #metronet-mapa {
            border: 1px solid #1E2833;
            border-radius: 12px;
            background: #070A0F;
            box-shadow: none;
        }

        #metronet-panel-controles {
            border: 1px solid #1E2833;
            border-radius: 12px;
            background: #111820;
            box-shadow: none;
        }

        .metronet-logo-marca {
            background: transparent;
        }

        .metronet-panel-titulo,
        .metronet-informacion-jugador-titulo {
            color: #F4F7FA;
        }

        .metronet-control-perfil {
            color: #F4F7FA;
            background: #1B2B3B;
        }

        .metronet-control-perfil:hover,
        .metronet-control-perfil:focus-visible {
            background: #263B50;
        }

        .metronet-control-simulacion,
        .metronet-control-sesion {
            border: 1px solid #263240;
            color: #E8EEF3;
            background: transparent;
        }

        .metronet-control-simulacion:hover,
        .metronet-control-simulacion:focus-visible,
        .metronet-control-sesion:hover,
        .metronet-control-sesion:focus-visible {
            border-color: #3B78C8;
            color: #F4F7FA;
            background: #1B2B3B;
        }

        button,
        input,
        select,
        textarea {
            border-color: #263240;
            color: #E8EEF3;
            background: #111820;
        }

        button:hover,
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3B78C8;
            background: #1B2B3B;
        }

        canvas {
            background: #070A0F;
        }

    </style>

</head>


<body>

    <div id="metronet-aplicacion">

        <main
            id="metronet-mapa"
            aria-label="Mapa de Montevideo"
        ></main>

        <aside
            id="metronet-panel-controles"
            aria-label="Controles del mapa"
        >
            <h1 class="metronet-panel-titulo">Controles del mapa</h1>
            <section id="metronet-informacion-jugador" class="metronet-informacion-jugador" aria-label="Información de jugador">
                <h2 class="metronet-informacion-jugador-titulo">Información de jugador</h2>
                <a id="metronet-control-perfil" class="metronet-control-perfil" href="/perfil.html">
                    Actualizar mis datos <span class="metronet-control-perfil-indicador" aria-hidden="true">▼</span>
                </a>
                <a class="metronet-control-simulacion" href="/login.html?destino=%2Fsimulacion.html">Crear simulación</a>
            </section>
            <button id="metronet-control-sesion" class="metronet-control-sesion" type="button">
                Cerrar sesión
            </button>
        </aside>

    </div>

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
