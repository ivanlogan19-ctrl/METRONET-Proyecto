<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METRONET</title>

    <style>

        /*
         * ============================================================
         * METRONET
         * ESTILO VISUAL RETRO VIDEOJUEGO 80s / 90s
         * ============================================================
         *
         * Solamente se modifica la presentación visual.
         *
         * El logo de METRONET no se modifica.
         *
         */

        :root {

            --neon-cyan:
                #00E5FF;

            --neon-blue:
                #008CFF;

            --neon-magenta:
                #FF00CC;

            --neon-purple:
                #8A2BE2;

            --neon-green:
                #39FF14;

            --neon-yellow:
                #FFE600;

            --dark-blue:
                #06111F;

            --dark-purple:
                #10051A;

            --panel:
                rgba(
                    4,
                    12,
                    27,
                    0.92
                );

            --panel-light:
                rgba(
                    10,
                    25,
                    48,
                    0.94
                );

            --border:
                rgba(
                    0,
                    229,
                    255,
                    0.75
                );

            --text:
                #E8FCFF;

        }


        /*
         * ============================================================
         * DOCUMENTO
         * ============================================================
         */

        html,
        body {

            margin:
                0;

            padding:
                0;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;

            background:
                #000000;

        }


        body {

            position:
                relative;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(
                        0,
                        80,
                        130,
                        0.10
                    ),
                    transparent 45%
                ),

                #000000;

            color:
                var(--text);

            font-family:
                "Courier New",
                monospace;

        }


        /*
         * ============================================================
         * CANVAS DE PHASER
         * ============================================================
         */

        canvas {

            display:
                block;

            background:
                #000000;

        }


        /*
         * ============================================================
         * EFECTO DE ESCANEO RETRO
         * ============================================================
         *
         * Muy sutil para no tapar el mapa.
         */

        body::after {

            content:
                "";

            position:
                fixed;

            inset:
                0;

            pointer-events:
                none;

            z-index:
                9990;

            background:

                repeating-linear-gradient(
                    to bottom,
                    rgba(
                        255,
                        255,
                        255,
                        0.025
                    ) 0px,
                    rgba(
                        255,
                        255,
                        255,
                        0.025
                    ) 1px,
                    transparent 1px,
                    transparent 4px
                );

            opacity:
                0.22;

        }


        /*
         * ============================================================
         * BRILLO GENERAL
         * ============================================================
         */

        body::before {

            content:
                "";

            position:
                fixed;

            inset:
                0;

            pointer-events:
                none;

            z-index:
                9980;

            box-shadow:
                inset 0 0 80px
                rgba(
                    0,
                    229,
                    255,
                    0.08
                );

        }


        /*
         * ============================================================
         * BOTONES DE METRONET
         * ============================================================
         *
         * Estos estilos se aplican a los controles HTML
         * creados por las capas de selección.
         */

        button {

            font-family:
                "Courier New",
                monospace;

            font-weight:
                bold;

            letter-spacing:
                0.3px;

            color:
                var(--text);

            background:
                linear-gradient(
                    180deg,
                    rgba(
                        8,
                        27,
                        52,
                        0.96
                    ),
                    rgba(
                        3,
                        12,
                        27,
                        0.96
                    )
                );

            border:
                1px solid
                var(--neon-cyan);

            border-radius:
                4px;

            box-shadow:

                0 0 4px
                rgba(
                    0,
                    229,
                    255,
                    0.7
                ),

                inset 0 0 5px
                rgba(
                    0,
                    229,
                    255,
                    0.12
                );

            text-shadow:

                0 0 4px
                rgba(
                    0,
                    229,
                    255,
                    0.8
                );

            transition:

                background
                0.12s ease,

                box-shadow
                0.12s ease,

                border-color
                0.12s ease,

                transform
                0.12s ease;

        }


        button:hover {

            color:
                #FFFFFF;

            border-color:
                #FFFFFF;

            background:
                linear-gradient(
                    180deg,
                    rgba(
                        0,
                        100,
                        150,
                        0.95
                    ),
                    rgba(
                        8,
                        20,
                        42,
                        0.98
                    )
                );

            box-shadow:

                0 0 5px
                var(--neon-cyan),

                0 0 12px
                rgba(
                    0,
                    229,
                    255,
                    0.45
                ),

                inset 0 0 7px
                rgba(
                    0,
                    229,
                    255,
                    0.2
                );

        }


        button:active {

            transform:
                translateY(1px);

            box-shadow:

                0 0 3px
                var(--neon-cyan),

                inset 0 0 8px
                rgba(
                    0,
                    229,
                    255,
                    0.3
                );

        }


        /*
         * ============================================================
         * CHECKBOXES
         * ============================================================
         */

        input[type="checkbox"] {

            appearance:
                none;

            -webkit-appearance:
                none;

            width:
                15px;

            height:
                15px;

            margin:
                0 8px 0 0;

            vertical-align:
                middle;

            background:
                #02060D;

            border:
                1px solid
                var(--neon-cyan);

            border-radius:
                2px;

            box-shadow:
                0 0 4px
                rgba(
                    0,
                    229,
                    255,
                    0.45
                );

            cursor:
                pointer;

            position:
                relative;

        }


        input[type="checkbox"]:checked {

            background:
                var(--neon-cyan);

            box-shadow:

                0 0 5px
                var(--neon-cyan),

                0 0 10px
                rgba(
                    0,
                    229,
                    255,
                    0.55
                );

        }


        input[type="checkbox"]:checked::after {

            content:
                "✓";

            position:
                absolute;

            left:
                2px;

            top:
                -3px;

            color:
                #001018;

            font-size:
                14px;

            font-weight:
                bold;

        }


        /*
         * ============================================================
         * PANELES
         * ============================================================
         */

        [class*="panel"],
        [class*="Panel"],
        [class*="selector"],
        [class*="Selector"] {

            scrollbar-color:
                var(--neon-cyan)
                #02060D;

        }


        /*
         * ============================================================
         * BARRA DE DESPLAZAMIENTO
         * ============================================================
         */

        ::-webkit-scrollbar {

            width:
                8px;

            height:
                8px;

        }


        ::-webkit-scrollbar-track {

            background:
                #02060D;

            border-left:
                1px solid
                rgba(
                    0,
                    229,
                    255,
                    0.18
                );

        }


        ::-webkit-scrollbar-thumb {

            background:
                linear-gradient(
                    180deg,
                    var(--neon-cyan),
                    var(--neon-blue)
                );

            border-radius:
                3px;

            box-shadow:
                0 0 5px
                var(--neon-cyan);

        }


        ::-webkit-scrollbar-thumb:hover {

            background:
                var(--neon-magenta);

            box-shadow:
                0 0 7px
                var(--neon-magenta);

        }


        /*
         * ============================================================
         * PANEL DE INFORMACIÓN DE PUNTOS DE INTERÉS
         * ============================================================
         */

        .metronet-punto-interes-panel {

            position:
                fixed;

            top:
                50%;

            left:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index:
                4000;

            width:
                300px;

            padding:
                20px;

            background:

                linear-gradient(
                    145deg,
                    rgba(
                        8,
                        20,
                        42,
                        0.97
                    ),
                    rgba(
                        12,
                        4,
                        25,
                        0.97
                    )
                );

            border:
                1px solid
                var(--neon-cyan);

            border-radius:
                5px;

            box-shadow:

                0 0 6px
                var(--neon-cyan),

                0 0 18px
                rgba(
                    0,
                    229,
                    255,
                    0.45
                ),

                inset 0 0 18px
                rgba(
                    0,
                    229,
                    255,
                    0.06
                );

            color:
                var(--text);

            font-family:
                "Courier New",
                monospace;

            text-shadow:
                0 0 4px
                rgba(
                    0,
                    229,
                    255,
                    0.35
                );

        }


        .metronet-punto-interes-titulo {

            margin-bottom:
                7px;

            color:
                var(--neon-cyan);

            font-size:
                18px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            text-shadow:

                0 0 5px
                var(--neon-cyan),

                0 0 10px
                rgba(
                    0,
                    229,
                    255,
                    0.4
                );

        }


        .metronet-punto-interes-tipo {

            margin-bottom:
                12px;

            color:
                var(--neon-magenta);

            font-size:
                13px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            text-shadow:
                0 0 5px
                rgba(
                    255,
                    0,
                    204,
                    0.65
                );

        }


        .metronet-punto-interes-descripcion {

            margin-bottom:
                13px;

            color:
                #D8F9FF;

            font-size:
                14px;

            line-height:
                1.5;

        }


        .metronet-punto-interes-barrio {

            padding-top:
                9px;

            border-top:
                1px solid
                rgba(
                    0,
                    229,
                    255,
                    0.3
                );

            color:
                var(--neon-green);

            font-size:
                12px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            text-shadow:
                0 0 5px
                rgba(
                    57,
                    255,
                    20,
                    0.5
                );

        }


        .metronet-punto-interes-cerrar {

            position:
                absolute;

            top:
                7px;

            right:
                9px;

            width:
                28px;

            height:
                28px;

            padding:
                0;

            border:
                1px solid
                var(--neon-magenta);

            background:
                rgba(
                    40,
                    0,
                    30,
                    0.7
                );

            color:
                var(--neon-magenta);

            font-size:
                21px;

            line-height:
                24px;

            cursor:
                pointer;

            box-shadow:
                0 0 5px
                rgba(
                    255,
                    0,
                    204,
                    0.5
                );

        }


        .metronet-punto-interes-cerrar:hover {

            color:
                #FFFFFF;

            border-color:
                #FFFFFF;

            box-shadow:
                0 0 8px
                var(--neon-magenta);

        }


        /*
         * ============================================================
         * SELECCIÓN DE TEXTO
         * ============================================================
         */

        ::selection {

            background:
                var(--neon-magenta);

            color:
                #FFFFFF;

        }

    </style>

</head>


<body>

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
