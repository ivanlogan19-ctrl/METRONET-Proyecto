<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>METRONET</title>


    <link rel="stylesheet" href="/src/mapa/estilos/layout-editor.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />

    <link rel="stylesheet" href="/src/estilos/retro.css" />
  </head>


<body class="metronet-pagina-editor">

    <div class="metronet-pantalla-editor">
        <div data-navegacion-global></div>
        <section class="metronet-estado-editor" data-estado-editor aria-label="Asistencia y mensajes del editor"></section>
        <div id="metronet-aplicacion">

        <div class="metronet-area-mapa">
            <section class="metronet-barra-geografica" aria-label="Referencias y territorio">
                <section data-contenedor-puntos-interes aria-label="Referencias del mapa"></section>
                <section class="metronet-territorio-selectores" aria-label="Selección geográfica">
                    <h2>Territorio</h2>
                    <div data-contenedor-selectores-mapa></div>
                </section>
            </section>
            <main id="metronet-mapa" aria-label="Mapa de Montevideo"></main>
        </div>

        <aside
            id="metronet-panel-controles"
            aria-label="Edición de red"
        >
            <header class="metronet-panel-editor-cabecera">
                <div>
                    <p class="metronet-panel-editor-sobretitulo">Constructor de red</p>
                    <h1 class="metronet-panel-titulo">Edición de red</h1>
                </div>
                <button class="metronet-panel-editor-toggle" data-panel-edicion-toggle type="button" aria-expanded="true">Herramientas</button>
            </header>
            <div class="metronet-panel-editor-contenido" data-panel-edicion-contenido>
                <div data-flujo-navegacion></div>
                <section class="metronet-consigna" data-contenedor-consigna hidden aria-live="polite"></section>
                <section class="metronet-panel-editor-herramientas" data-contenedor-editor-red></section>
                <footer class="metronet-panel-editor-pie" data-panel-editor-pie></footer>
            </div>
        </aside>

    </div>
    </div>

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>

</html>
