<!doctype html>
<html lang="es" data-contexto-musical="auth">
  <head>
  <link rel="stylesheet" href="/src/estilos/navegacion-estable.css" />
  <script src="/transicion-pagina.js"></script>
  <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" async vite-ignore src="/src/audio/ReanudacionTemprana.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administración · METRONET</title>
    <link rel="stylesheet" href="/src/autenticacion/autenticacion.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />
    <link rel="stylesheet" href="/src/estilos/retro.css" />

  <script type="module" blocking="render" src="/src/componentes/inicializarLogoMetronet.js"></script>
  <script type="module" blocking="render" src="/src/administracion/login-admin.js"></script>
  <script type="module" blocking="render" src="/src/audio/AudioAutenticacion.js"></script>
</head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="tituloAdmin">
        <div class="auth-card__presentacion">
          <div class="mobile-brand auth-marca" data-metronet-logo></div>
        </div>
        <div class="auth-card__contenido">
          <h1 id="tituloAdmin">Administración</h1>
          <p class="auth-subtitle auth-subtitle--admin">
            Ingresá con una cuenta que tenga permisos de administrador.
          </p>
          <form id="loginAdminForm" class="auth-form" novalidate>
            <div class="field-group">
              <label for="usuario">Identificador de administrador</label>
              <div class="input-wrapper">
                <input
                  id="usuario"
                  type="text"
                  autocomplete="username"
                  placeholder="Ingresá tu identificador"
                  required
                />
              </div>
            </div>
            <div class="field-group">
              <label for="password">Contraseña</label>
              <div class="input-wrapper">
                <input
                  id="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Ingresá tu contraseña"
                  required
                />
                <button
                  class="toggle-password"
                  type="button"
                  data-target="password"
                >
                  Mostrar
                </button>
              </div>
            </div>
            <button id="loginAdminButton" class="primary-button" type="submit">
              <span class="button-text">Ingresar a administración</span>
              <span class="button-loader" aria-hidden="true"></span>
            </button>
          </form>
          <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
          <p class="auth-link">
            ¿Sos usuario? <a href="/login.html">Volver a iniciar sesión</a>
          </p>
        </div>
      </section>
    </main>



  </body>
</html>
