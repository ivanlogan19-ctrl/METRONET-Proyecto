<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="/css/principal.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroNet</title>
</head>
<body>
    <button id="btnCrearEstacion">Crear estación</button>
    <button id="btnCrearLinea">Crear línea</button>

    <div id="menuEstacion" hidden>
      <button id="btnMoverEstacion">Mover</button> <br/>
      <button id="btnCambiarNombreEstacion">Cambiar nombre</button> <br/>
      <button id="btnEliminarEstacionMenu">Eliminar</button> <br/>
    </div>

    <div id="menuLinea" hidden>
      <button id="btnModificarLinea">Modificar recorrido</button> <br/>
      <button id="btnCambiarNombreLinea">Cambiar nombre</button> <br/>
      <button id="btnEliminarLinea">Eliminar</button> <br/>
    </div>

    <div id="formCambiarNombreLinea" class="modal" hidden>
      <div class="modal-contenido">
        <h2>Cambiar nombre de línea</h2>

        <label for="nuevoNombreLinea">Nombre:</label>
        <input type="text" id="nuevoNombreLinea">

        <button id="btnCancelarCambiarNombreLinea">Cancelar</button>
        <button id="btnGuardarNombreLinea">Guardar</button>
      </div>
    </div>
    
    <div id="formEstacion" class="modal" hidden>
      <div class="modal-contenido">
        <h2>Crear estación</h2>

        <label for="nombreEstacion">Nombre:</label>
        <input type="text" id="nombreEstacion">

        <button id="btnCancelarEstacion">Cancelar</button>
        <button id="btnContinuarEstacion">Continuar</button>
      </div>
    </div>

    <div id="formEditarEstacion" class="modal" hidden>
      <div class="modal-contenido">
        <h2>Editar estación</h2>

        <label for="nombreEstacionEditar">Nombre:</label>
        <input type="text" id="nombreEstacionEditar">

        <button id="btnEliminarEstacion">Eliminar</button>
        <button id="btnCancelarEditarEstacion">Cancelar</button>
        <button id="btnGuardarEstacion">Guardar</button>
      </div>
    </div>

    <div id="formLinea" class="modal" hidden>
      <div class="modal-contenido">
        <h2>Crear línea</h2>

        <label for="nombreLinea">Nombre:</label>
        <input type="text" id="nombreLinea">

        <button id="btnCancelarLinea">Cancelar</button>
        <button id="btnContinuarLinea">Continuar</button>
      </div>
    </div>

    <div id="controlesLinea" hidden>
      <button id="btnCancelarCreacionLinea">Cancelar</button>
      <button id="btnGuardarLinea">Guardar</button>
    </div>

    <div id="confirmarEliminarLinea" hidden>
      <p>¿Está seguro de que quiere eliminar esta línea?</p>

      <button id="btnConfirmarEliminarLinea">Sí, eliminar</button>
      <button id="btnCancelarEliminarLinea">Cancelar</button>
    </div>

        <div id="confirmarEliminarEstacion" hidden>
      <p>¿Está seguro de que quiere eliminar esta estación?</p>

      <button id="btnConfirmarEliminarEstacion">
        Sí, eliminar
      </button>

      <button id="btnCancelarEliminarEstacion">
        Cancelar
      </button>
    </div>

    <div id="juego"></div>

    <script type="module" src="/js/juego.js"></script>
</body>
</html>
