<!doctype html>
<html lang="es" data-contexto-musical="menu">
<head>
  <link rel="stylesheet" href="/src/estilos/navegacion-estable.css" />
  <script src="/transicion-pagina.js"></script>
  <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" async vite-ignore src="/src/audio/ReanudacionTemprana.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking · METRONET</title>
  <link rel="stylesheet" href="/src/estilos/metronet.css" />
  <link rel="stylesheet" href="/src/estilos/retro.css" />
  <link rel="stylesheet" href="/src/educacion/ranking.css" />

  <script type="module" blocking="render" src="/src/educacion/ranking.js"></script>
</head>
<body class="metronet-pagina-navegable metronet-pagina-ranking">
  <div data-navegacion-global></div>
  <main class="metronet-ranking">
    <header class="ranking-cabecera"><h1>Ranking METRONET</h1></header>
    <div class="ranking-columnas">
    <section class="ranking-marcador" aria-labelledby="tituloClasificacion">
      <h2 id="tituloClasificacion">Clasificación general</h2>
      <div class="ranking-vistas metronet-pestanas" aria-label="Vista de puntajes">
        <button id="verClasificacion" type="button" aria-pressed="true" aria-controls="vistaClasificacion">Clasificación</button>
        <button id="verPuntosNivel" type="button" aria-pressed="false" aria-controls="vistaPuntosNivel">Puntos por nivel</button>
      </div>
      <div id="vistaClasificacion" class="ranking-vista">
      <div class="ranking-tabla-contenedor" tabindex="0" role="region" aria-label="Tabla de puntuaciones">
        <table class="ranking-tabla">
          <thead><tr><th scope="col">Pos.</th><th scope="col">Jugador</th><th scope="col">Puntos</th><th scope="col">Niveles</th></tr></thead>
          <tbody id="clasificacionRanking" class="ranking-clasificacion"></tbody>
          <tbody id="estadoRanking"><tr><td colspan="4"><p id="mensajeRanking" role="status" aria-live="polite">Consultando resultados…</p><button type="button" id="reintentarRanking" hidden data-accion-ui="reintentar" data-categoria-accion="principal">Reintentar</button></td></tr></tbody>
        </table>
      </div>
      <nav class="ranking-paginacion" aria-label="Páginas de clasificación"><button id="rankingAnterior" type="button" data-accion-ui="anterior" data-categoria-accion="secundaria" disabled>Anterior</button><span id="paginaRanking" role="status">1 / 1</span><button id="rankingSiguiente" type="button" data-accion-ui="siguiente" data-categoria-accion="secundaria" disabled>Siguiente</button></nav>
      </div>
      <div id="vistaPuntosNivel" class="ranking-vista" hidden>
        <p id="resumenPuntosNivel" class="ranking-detalle__resumen" role="status">Consultando resultados…</p>
        <ol id="puntajesPorNivel" class="ranking-niveles"></ol>
        <nav class="ranking-paginacion" aria-label="Páginas de puntos por nivel"><button id="nivelAnterior" type="button" data-accion-ui="anterior" data-categoria-accion="secundaria" disabled>Anterior</button><span id="paginaPuntosNivel" role="status">1 / 1</span><button id="nivelSiguiente" type="button" data-accion-ui="siguiente" data-categoria-accion="secundaria" disabled>Siguiente</button></nav>
      </div>
      <p class="ranking-nota">Mejor puntaje por nivel · Reiniciar conserva tus logros.</p>
    </section>
    <section class="ranking-trofeos" aria-labelledby="tituloTrofeos">
      <div class="ranking-trofeos__cabecera"><div><h2 id="tituloTrofeos">Trofeos</h2></div><div><p id="resumenTrofeos" role="status" aria-live="polite">Consultando premios…</p><button id="reintentarTrofeos" type="button" hidden data-accion-ui="reintentar" data-categoria-accion="principal">Reintentar</button></div></div>
      <div id="galeriaTrofeos" class="ranking-trofeos__galeria" aria-label="Elegí un trofeo"></div>
      <div id="detalleTrofeo" class="ranking-trofeo-detalle" aria-live="polite"></div>
    </section>
    </div>
    <aside id="resumenPersonalRanking" class="ranking-personal" aria-labelledby="tituloMiDesempeno"><h2 id="tituloMiDesempeno">Tu desempeño</h2><p id="resumenPuntaje"></p></aside>
  </main>

</body>
</html>
