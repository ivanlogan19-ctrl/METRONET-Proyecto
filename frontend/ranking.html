<!doctype html>
<html lang="es" data-contexto-musical="menu">
<head>
  <link rel="stylesheet" href="/src/estilos/navegacion-estable.css" />
  <script src="/transicion-pagina.js"></script>
  <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" async vite-ignore src="/src/audio/ReanudacionTemprana.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking · METRONET</title>
  <link rel="stylesheet" href="/src/estilos/metronet.css" />
  <link rel="stylesheet" href="/src/estilos/retro.css" />
  <link rel="stylesheet" href="/src/educacion/ranking.css" />

  <script type="module" blocking="render" src="/src/educacion/ranking.js"></script>
</head>
<body class="metronet-pagina-navegable metronet-pagina-ranking">
  <div data-navegacion-global></div>
  <main class="metronet-ranking">
    <header class="ranking-cabecera"><h1>Ranking METRONET</h1></header>
    <img class="ranking-ilustracion ranking-ilustracion--ari" src="/assets/personajes/ranking-ari-trofeo.svg" alt="" aria-hidden="true" width="192" height="256" />
    <img class="ranking-ilustracion ranking-ilustracion--sol" src="/assets/personajes/ranking-sol-trofeo.svg" alt="" aria-hidden="true" width="192" height="256" />
    <section class="ranking-marcador" aria-labelledby="tituloClasificacion">
      <h2 id="tituloClasificacion">Clasificación general</h2>
      <div class="ranking-tabla-contenedor" tabindex="0" role="region" aria-label="Tabla de puntuaciones">
        <table class="ranking-tabla">
          <thead><tr><th scope="col">Pos.</th><th scope="col">Jugador</th><th scope="col">Puntos</th><th scope="col">Niveles</th></tr></thead>
          <tbody id="clasificacionRanking" class="ranking-clasificacion"></tbody>
          <tbody id="estadoRanking"><tr><td colspan="4"><p id="mensajeRanking" role="status" aria-live="polite">Consultando resultados…</p><button type="button" id="reintentarRanking" hidden>Volver a consultar</button></td></tr></tbody>
        </table>
      </div>
      <p class="ranking-nota">Mejor puntaje por nivel · Reiniciar conserva tus logros.</p>
    </section>
    <aside class="ranking-personal" aria-labelledby="tituloMiDesempeno"><h2 id="tituloMiDesempeno">Tu desempeño</h2><p id="resumenPuntaje"></p></aside>
    <section class="ranking-trofeos" aria-labelledby="tituloTrofeos">
      <div class="ranking-trofeos__cabecera"><div><p class="metronet-inicio__etiqueta">Colección</p><h2 id="tituloTrofeos">Trofeos</h2></div><div><p id="resumenTrofeos" role="status" aria-live="polite">Consultando premios…</p><button id="reintentarTrofeos" type="button" hidden>Volver a consultar premios</button></div></div>
      <div id="galeriaTrofeos" class="ranking-trofeos__galeria"></div>
    </section>
    <details class="ranking-detalle"><summary id="tituloPuntosNivel">Tus puntos por nivel</summary><p id="resumenPuntosNivel" class="ranking-detalle__resumen"></p><ol id="puntajesPorNivel" class="ranking-niveles"></ol></details>
  </main>

</body>
</html>
