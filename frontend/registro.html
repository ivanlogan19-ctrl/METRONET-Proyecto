<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro · METRONET</title>
    <link rel="stylesheet" href="/src/autenticacion/autenticacion.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="brand-panel" aria-label="Presentación de METRONET">
        <div class="metro-map" aria-hidden="true"></div>
        <div class="brand-content">
          <img
            class="brand-logo"
            src="/assets/logoMETRONET.png"
            alt="Logo de METRONET"
          />
          <p class="eyebrow">Nuevo usuario</p>
          <h1>METRONET</h1>
          <p class="descripcion">
            Creá tu cuenta para acceder al mapa y continuar con la simulación.
          </p>
        </div>
      </section>
      <section class="auth-card" aria-labelledby="tituloRegistro">
        <div class="mobile-brand">
          <img src="/assets/logoMETRONET.png" alt="" />
          <span>METRONET</span>
        </div>
        <p class="eyebrow">Simulador de red de metro</p>
        <h2 id="tituloRegistro">Registro de usuario</h2>
        <p class="auth-subtitle">Completá tus datos para crear una cuenta.</p>
        <form id="registroForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="nombre">Nombre</label>
            <div class="input-wrapper">
              <input
                id="nombre"
                type="text"
                autocomplete="name"
                placeholder="Tu nombre"
                required
              />
            </div>
          </div>
          <div class="field-group">
            <label for="apellido">Apellido</label>
            <div class="input-wrapper">
              <input
                id="apellido"
                type="text"
                autocomplete="family-name"
                placeholder="Tu apellido"
                required
              />
            </div>
          </div>
          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <div class="input-wrapper">
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="usuario@correo.com"
                required
              />
            </div>
          </div>
          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                autocomplete="new-password"
                placeholder="Creá una contraseña"
                required
              />
              <button
                class="toggle-password"
                type="button"
                data-target="password"
              >
                Mostrar
              </button>
              <div class="requisitos-contrasena" role="tooltip">
                Mínimo 6 caracteres, una mayúscula y un carácter especial.
              </div>
            </div>
          </div>
          <div class="consentimiento">
            <input
              id="aceptaDatos"
              type="checkbox"
              required
              aria-describedby="detalleConsentimiento"
            />
            <label for="aceptaDatos" id="detalleConsentimiento">
              Acepto el almacenamiento de mis datos para crear y administrar mi
              cuenta. <a href="/privacidad.html">Conocer el uso de mis datos</a>
            </label>
          </div>
          <button id="registroButton" class="primary-button" type="submit">
            <span class="button-text">Registrarse</span
            ><span class="button-loader" aria-hidden="true"></span>
          </button>
        </form>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <p class="auth-link">
          ¿Ya tenés una cuenta? <a href="/login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>
    <script type="module" src="/src/autenticacion/registro.js"></script>
  </body>
</html>
