<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - METRONET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="brand-panel" aria-label="Presentación de MetroNet">
      <div class="metro-map" aria-hidden="true"></div>
      <div class="brand-content">
        <img src="img/metronet-logo.svg" alt="Logo de METRONET" class="brand-logo" />
        <p class="eyebrow">Nuevo usuario</p>
        <h1>METRONET</h1>
        <p class="brand-description">
          Creá tu cuenta para comenzar a modelar, gestionar y visualizar redes de metro.
        </p>
      </div>
    </section>

    <section class="auth-card" aria-labelledby="registroTitle">
      <div class="mobile-brand">
        <img src="img/metronet-logo.svg" alt="Logo de METRONET" class="mobile-logo" />
        <span>METRONET</span>
      </div>

      <p class="eyebrow">Registro</p>
      <h2 id="registroTitle">Crear usuario</h2>
      <p class="auth-subtitle">Completá tus datos para crear una nueva cuenta.</p>

      <form id="registroForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="nombre">Nombre</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">👤</span>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required />
          </div>
        </div>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">@</span>
            <input type="email" id="email" name="email" placeholder="usuario@correo.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">●</span>
            <input type="password" id="password" name="password" placeholder="Creá una contraseña" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar u ocultar contraseña">👁</button>
          </div>
        </div>

        <button type="submit" id="registroButton" class="primary-button">
          <span class="button-text">Registrarse</span>
          <span class="button-loader" aria-hidden="true"></span>
        </button>
      </form>

      <p id="mensaje" class="message" role="status" aria-live="polite"></p>

      <p class="auth-link">
        ¿Ya posee una cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>
    </section>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
