<!doctype html>
<html lang="es" data-contexto-musical="auth">
  <head>
  <link rel="stylesheet" href="/src/estilos/navegacion-estable.css" />
  <script src="/transicion-pagina.js"></script>
  <link rel="preload" href="/assets/fonts/silkscreen/Silkscreen-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script type="module" async vite-ignore src="/src/audio/ReanudacionTemprana.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro · METRONET</title>
    <link rel="stylesheet" href="/src/autenticacion/autenticacion.css" />
    <link rel="stylesheet" href="/src/estilos/metronet.css" />
    <link rel="stylesheet" href="/src/estilos/retro.css" />

  <script type="module" blocking="render" src="/src/componentes/inicializarLogoMetronet.js"></script>
  <script type="module" blocking="render" src="/src/autenticacion/registro.js"></script>
  <script type="module" blocking="render" src="/src/audio/AudioAutenticacion.js"></script>
</head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="tituloRegistro">
        <div class="auth-card__presentacion">
          <div class="mobile-brand auth-marca" data-metronet-logo data-logo-alternativo=""></div>
        </div>
        <div class="auth-card__contenido">
          <h1 id="tituloRegistro">Crear cuenta</h1>
          <p class="auth-subtitle auth-subtitle--registro">Completá la información para comenzar a usar METRONET.</p>
          <form id="registroForm" class="auth-form" novalidate>
            <fieldset class="auth-form-section">
              <legend>Información personal</legend>
              <div class="field-group">
                <label for="nombre">Nombre</label>
                <div class="input-wrapper">
                  <input
                    id="nombre"
                    type="text"
                    autocomplete="name"
                    placeholder="Tu nombre"
                    required
                  />
                </div>
              </div>
              <div class="field-group">
                <label for="apellido">Apellido</label>
                <div class="input-wrapper">
                  <input
                    id="apellido"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Tu apellido"
                    required
                  />
                </div>
              </div>
            </fieldset>
            <fieldset class="auth-form-section">
              <legend>Cuenta</legend>
              <div class="field-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrapper">
                  <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="usuario@correo.com"
                    required
                  />
                </div>
              </div>
              <div class="field-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                  <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Creá una contraseña"
                    required
                  />
                  <button
                    class="toggle-password"
                    type="button"
                    data-target="password"
                  >
                    Mostrar
                  </button>
                  <div class="requisitos-contrasena" role="tooltip">
                    Mínimo 6 caracteres, una mayúscula y un carácter especial.
                  </div>
                </div>
              </div>
            </fieldset>
            <section
              class="auth-privacidad-seccion"
              aria-labelledby="tituloPrivacidadRegistro"
            >
              <p id="tituloPrivacidadRegistro" class="auth-seccion-titulo">Privacidad</p>
              <div class="consentimiento consentimiento-destacado">
                <input
                  id="aceptaDatos"
                  type="checkbox"
                  required
                  aria-describedby="detalleConsentimiento"
                />
                <label for="aceptaDatos" id="detalleConsentimiento">
                  Acepto el uso de mis datos para crear y administrar mi cuenta.
                  <a href="/privacidad.html">Leer el uso de mis datos</a>
                </label>
              </div>
            </section>
            <button id="registroButton" class="primary-button" type="submit">
              <span class="button-text">Crear cuenta</span>
              <span class="button-loader" aria-hidden="true"></span>
            </button>
          </form>
          <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
          <p class="auth-link">
            ¿Ya tenés una cuenta? <a href="/login.html">Iniciar sesión</a>
          </p>
        </div>
      </section>
    </main>



  </body>
</html>
